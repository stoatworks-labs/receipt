      <noscript>
        <h1>Receipt</h1>
        <p>
          An FFGL effect that prints your clip on a thermal receipt printer: a
          line of tiny heaters, 8 to the millimetre, and no ink, just paper that
          darkens where it gets hot enough. It prints one dot row at a time, and
          the look comes from the heat rather than being drawn. Tone is a Bayer,
          Floyd-Steinberg or Atkinson dither. A heater that fired is still warm
          on the next row, so lines thicken, marks run on below themselves and
          dark areas block up unless the firmware's history control takes the
          heat off. The supply can only fire so many dots at once, so dense rows
          print paler and band at the strobe blocks. A slipping roller repeats
          or overprints rows, and in Printing mode the receipt scrolls out of
          the slot and tears off.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/receipt">its repository</a>.
        </p>
